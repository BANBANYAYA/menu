<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Duck Bakery 手作面包菜单">
  <title>Duck Bakery｜今日菜单</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="Duck Bakery 首页">
      <img class="brand-mark" src="images-styled/duck-handdrawn.png" alt="" width="36" height="36">
      <strong>Duck Bakery</strong>
    </a>
    <button class="cart-chip" id="cartOpen" type="button" aria-controls="cartDrawer" aria-expanded="false">
      购物袋 <span id="cartCount">0</span>
    </button>
  </header>

  <main id="top" class="page-shell">
    <div class="hero">
      <h1>Duck Bakery</h1>
    </div>

    <section class="menu-panel" aria-label="面包菜单">
      <div class="toolbar">
        <div id="filters" class="filters" aria-label="商品分类"></div>
        <label class="search-box">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="searchInput" type="search" placeholder="搜索面包" aria-label="搜索口味或面包" autocomplete="off">
        </label>
      </div>
      <span id="resultCount" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
      <div id="productGrid" class="product-grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        <p>没有找到相关面包</p>
      </div>
    </section>
  </main>

  <div id="drawerMask" class="drawer-mask" hidden></div>
  <aside id="cartDrawer" class="cart-drawer" role="dialog" aria-labelledby="cartTitle" aria-hidden="true" inert>
    <div class="drawer-head"><h2 id="cartTitle">购物袋</h2><button id="cartClose" class="icon-btn" type="button" aria-label="关闭购物袋">×</button></div>
    <div id="cartItems" class="cart-items"></div>
    <div class="drawer-foot"><p>共 <strong id="cartTotal">0</strong> 件</p><div class="drawer-actions"><button id="cartClear" class="button secondary">清空</button><button id="cartCopy" class="button primary">复制清单</button></div></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
