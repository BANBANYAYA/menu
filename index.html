<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Duck Bakery 手作面包菜单">
  <title>Duck Bakery｜今日菜单</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="Duck Bakery 首页">
      <img src="images/鸭子.png" alt="" width="36" height="36">
      <span><strong>Duck Bakery</strong><small>小鸭手作烘焙</small></span>
    </a>
    <button class="cart-chip" id="cartOpen" type="button" aria-controls="cartDrawer">
      购物袋 <span id="cartCount">0</span>
    </button>
  </header>

  <main id="top" class="page-shell">
    <section class="hero">
      <p class="eyebrow">FRESHLY BAKED · 用心慢慢烤</p>
      <h1>今天，想吃点什么？</h1>
      <p>柔软的吐司、香香的碱水，还有一点让心情变好的甜。</p>
      <div class="hero-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>

    <section class="menu-panel" aria-labelledby="menuTitle">
      <div class="section-heading">
        <div><p class="eyebrow">OUR MENU</p><h2 id="menuTitle">面包菜单 <i aria-hidden="true"></i></h2></div>
        <span id="resultCount" class="result-count"></span>
      </div>
      <div class="toolbar">
        <div id="filters" class="filters" aria-label="商品分类"></div>
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索口味或面包…" autocomplete="off">
        </label>
      </div>
      <div id="productGrid" class="product-grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        <span>🦆</span><h3>没有找到这款面包</h3><p>换个关键词，或者看看其他分类吧。</p>
      </div>
    </section>
  </main>

  <footer><img src="images/鸭子.png" alt="" width="30"><p>谢谢你来逛小鸭面包店 ♡</p></footer>

  <div id="drawerMask" class="drawer-mask" hidden></div>
  <aside id="cartDrawer" class="cart-drawer" aria-labelledby="cartTitle" aria-hidden="true">
    <div class="drawer-head"><div><p class="eyebrow">YOUR BAG</p><h2 id="cartTitle">购物袋</h2></div><button id="cartClose" class="icon-btn" aria-label="关闭购物袋">×</button></div>
    <div id="cartItems" class="cart-items"></div>
    <div class="drawer-foot"><p>共 <strong id="cartTotal">0</strong> 件</p><div class="drawer-actions"><button id="cartClear" class="button secondary">清空</button><button id="cartCopy" class="button primary">复制清单</button></div></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
